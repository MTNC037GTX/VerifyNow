<!DOCTYPE html>
<html>
<head>
    <title>VerifyNow</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!--for icons-->
    
</head>
<body>
<!-- Header -->
    <header class="header1">
        <div class="left-section">
            <div class="logo-box">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span class="app-name">VerifyNow</span>
        </div>

        <div class="right-section">
            <a href="/auth/login" class="login-btn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                Log in
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <section class="main-section">
        <div class="container">
            <div class="text-content">
                <h1>Protect Yourself from<br> <span class="highlight">Fake News and <br>Phishing.</span></h1>
                <h6>Analyze content and stay safe from phishing threats with<br> our advanced detection technology.<h6>
                <a href="/auth/login" class="start-btn">Get Started <i class="fa-solid fa-arrow-right"></i></a>
            </div>
            <div class="image">
                <img src="/static/uploads/interface.png" alt="Fake News Detection Interface">
            </div>
        </div>
    </section>

</body>
</html>
