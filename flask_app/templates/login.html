<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!--for icons-->
    
</head>
<body>
    <div class="login-container">
        
        <div class="login-card">
            <div class="back-btn">
                <a href="/" class="back-btn"><i class="fa-solid fa-arrow-left"></i>Back</a>
            </div>

            <div class="login-header">
                <div class="logo-circle">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h3>VerifyNow</h3>
            </div>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="toast {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form class="login-form" method="POST" action="{{ url_for('auth.login') }}">
                <label for="user_id">User ID</label>
                <input type="text" id="user_id" name="user_id" placeholder="Please enter your user ID" required>

                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Please enter your password" required>
                    <i class="fa-solid fa-eye" id="togglePassword"></i>
                </div>

                <!-- ERROR MESSAGE -->
                {% if error %}
                <p class="b3">{{ error }}</p>
                {% endif %}

                <button type="submit" class="login-btn2"> 
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>Log In
                </button>
            </form>
            <div class="register-link">
                <p>Don’t have an account?  <a href="/auth/register">Register</a></p>
            </div>
        </div>
    </div>
    
    <!-- Flash notification script -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const toasts = document.querySelectorAll(".toast");
        toasts.forEach(toast => {
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => {
                    toast.remove();
                }, 500);
            }, 3000);
        });
    });
    </script>

    <!-- Show/hide password-->
    <script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        togglePassword.classList.toggle("fa-eye");
        togglePassword.classList.toggle("fa-eye-slash");
    });
    </script>

</body>
</html>
